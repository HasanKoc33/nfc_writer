name: nfc_writer
description: "NFC Writter App"


publish_to: 'none'

version: 1.2.0+18

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  nfc_manager: ^4.0.2
  easy_localization: ^3.0.7+1
  google_mobile_ads: ^5.3.1
  url_launcher: ^6.3.1
  in_app_review: ^2.0.10
  provider: ^6.1.1
  shared_preferences: ^2.5.2
  fl_chart: ^0.69.0
  go_router: ^14.2.7
  in_app_purchase: ^3.2.1
  dio: ^5.8.0+1
  nfc_manager_ndef: ^1.0.1
  shimmer: ^3.0.0
  plugin_wifi_connect: ^2.0.1
  wifi_iot: ^0.3.19+2
  facebook_app_events: ^0.20.1
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.2
  flutter_local_notifications: ^20.1.0
  uuid: ^4.5.1



  #firesoft
  firesoft_base:
    path: ../../firesoft_base

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

#flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"



flutter:
  uses-material-design: true

  assets:
    - assets/gif/
    - assets/translations/
    - assets/config/
